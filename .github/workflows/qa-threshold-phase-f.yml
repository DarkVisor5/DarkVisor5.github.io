# THRESHOLD_CHANGE_ID: THR-20261103-005 — 20 fresh seed A/B vs v004, 5000 actions per run.
# THRESHOLD_CHANGE_ID: THR-20261103-004 — test v003 vs optimized v004 with novel seeds, no game engine changes.
# THRESHOLD_CHANGE_ID: THR-20261103-003 — QA 5000 action cap, new holdout seeds, no game changes
# THRESHOLD_CHANGE_ID: THR-20261103-001 — QA-only, v18.26 playable unaffected
name: Threshold v18.26 - Phase F bot and paired seed QA
on:
  push:
    branches: [main]
    paths:
      - 'tools/qa_phase_f_*.js'
      - 'tools/qa_phase_f_*.cjs'
      - '.github/workflows/qa-threshold-phase-f.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and policy decisions
        run: |
          node --check tools/qa_phase_f_bot.js
          node --check tools/qa_phase_f_previous_bot.js
          node --check tools/qa_phase_c_view.js
          node --check tools/qa_phase_f_worker.cjs
          node --check tools/qa_phase_f_paired_runner.cjs
          node --check tools/qa_phase_f_unit.cjs
          node tools/qa_phase_f_unit.cjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Test actual full runs on paired initial seeds (smoke sample)
        env:
          THRESHOLD_PAIR_COUNT: '20'
          THRESHOLD_FIRST_SEED: '20261173'
          THRESHOLD_TURN_LIMIT: '5000'
          THRESHOLD_CONTROL_PROFILE: 'prior'
          THRESHOLD_RESULTS_DIR: /tmp/threshold-phase-f-paired
        run: node tools/qa_phase_f_paired_runner.cjs
      - name: Upload raw game evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threshold-phase-f-paired-evidence
          path: /tmp/threshold-phase-f-paired
          retention-days: 30
