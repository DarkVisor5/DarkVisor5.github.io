name: Build Threshold v18 modular preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_v18_preview.py'
      - 'tools/artpass_v18_1.py'
      - 'tools/artpass_v18_2.py'
      - '.github/workflows/build-threshold-v18.yml'
permissions:
  contents: write
jobs:
  generate-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract CSS, JavaScript and assets
        run: python tools/build_v18_preview.py
      - name: Apply v18.1 dungeon art pass
        run: |
          python tools/artpass_v18_1.py
          python tools/artpass_v18_2.py
          node --check threshold-v18-preview/js/game.js
      - name: Commit preview separately from live game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add threshold-v18-preview
          if ! git diff --cached --quiet; then
            git commit -m "Build Threshold v18 modular preview"
            git push
          fi
