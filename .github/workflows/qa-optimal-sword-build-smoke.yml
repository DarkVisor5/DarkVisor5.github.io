name: Threshold optimal sword deck smoke
on:
  push:
    branches: [main]
    paths:
      - 'tools/qa_optimal_sword_build_runner.cjs'
      - 'tools/qa_optimal_sword_build_bot.js'
      - '.github/workflows/qa-optimal-sword-build-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check tools/qa_optimal_sword_build_bot.js
          node --check tools/qa_optimal_sword_build_runner.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Buy exact rank IV deck and play 5 real runs
        env:
          THRESHOLD_RUNS: '5'
          THRESHOLD_TURN_LIMIT: '1800'
          THRESHOLD_RESULTS_DIR: ${{ github.workspace }}/results/sword-smoke
        run: node tools/qa_optimal_sword_build_runner.cjs
      - name: Preserve card selection and game evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimal-sword-smoke-evidence
          path: results/sword-smoke/
          retention-days: 30
