name: Threshold v18 - Phase B regression
on:
  push:
    branches: [main]
    paths:
      - 'threshold-v18-preview/js/**'
      - 'tools/qa_v18_26_world.cjs'
      - 'tools/qa_v18_26_browser.cjs'
      - 'tools/qa_v18_27_lighting.cjs' # THR-20261106-001
      - 'tools/qa_v18_28_art_direction.cjs' # THR-20261106-002
      - 'tools/qa_v18_27_deep.cjs'
      - 'threshold-v18-preview/index.html'
      - 'tools/qa_v18_25_phaseb.cjs'
      - 'tools/qa_v18_24_furniture.cjs'
      - '.github/workflows/qa-threshold-v18.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      # THRESHOLD_CHANGE_ID: THR-20261106-001 — compare before/after lighting.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check threshold-v18-preview/js/game.js
          node --check threshold-v18-preview/js/riddles.js
          node --check threshold-v18-preview/js/phase-b.js
          node --check threshold-v18-preview/js/phase-b-world.js
          node tools/qa_v18_24_furniture.cjs
          node tools/qa_v18_25_phaseb.cjs
          node tools/qa_v18_26_world.cjs
          node --check tools/qa_v18_27_lighting.cjs
          node --check tools/qa_v18_28_art_direction.cjs
      - name: Install Playwright and Chromium for real browser smoke tests
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Exercise dungeon in Chromium desktop and mobile
        run: |
          node tools/qa_v18_26_browser.cjs
          node tools/qa_v18_27_lighting.cjs
          node tools/qa_v18_28_art_direction.cjs
      - name: Upload lighting before/after screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threshold-v18-27-lighting-before-after
          path: /tmp/threshold-lighting-*.png
          retention-days: 30
      - name: Upload room design pilot before-after screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threshold-v18-28-art-reset-before-after
          path: /tmp/threshold-art-*.png
          retention-days: 30
      - name: Generate 500 real floors and verify mandatory routes and puzzles
        timeout-minutes: 10
        run: node tools/qa_v18_27_deep.cjs
